name: OneSquad isolated update pilot
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without v (for example 1.1.0)
        required: true
permissions:
  contents: read
concurrency:
  group: onesquad-pilot
  cancel-in-progress: false
jobs:
  propose:
    if: github.repository == 'WillyDKT/onesquad-update-lab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check distribution fixtures
        run: python3 -m unittest discover -s distribution -p 'test_*.py'
      - name: Propose update to the disposable adopter only
        env:
          GH_TOKEN: ${{ secrets.PILOT_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PILOT_TOKEN is missing. Configure approved cross-repository access first."
            exit 1
          fi
          version="${INPUT_VERSION:-${RELEASE_TAG#v}}"
          python3 distribution/publish.py --version "$version"
